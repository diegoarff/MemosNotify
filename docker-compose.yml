# Example compose: runs MemoNudge against your existing Memos instance.
#
# MemoNudge talks to Memos two ways, and each just needs network reachability:
#   • MemoNudge → Memos : it calls the Memos API at `memos.baseUrl` (for complete/archive
#     and deep links). Optional, only if you use those actions.
#   • Memos → MemoNudge : Memos POSTs to MemoNudge's webhook on port 3000. Always needed.
#
#   docker compose up -d
#
# Then in Memos → Settings → Webhooks add a URL that reaches this container, ending in
# /memos-webhook (see the two options below).

services:
  memonudge:
    image: ghcr.io/diegoarff/memonudge:latest
    # build: .   # uncomment to build from local source instead of pulling the image
    container_name: memonudge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - memonudge-data:/app/data

    # ── Option A (simplest): publish the webhook port and use host-reachable URLs. Works no
    #    matter how your Memos runs. Then set:
    #      memos.baseUrl (config.yaml) = http://<host-ip>:5230
    #      webhook URL (in Memos)      = http://<host-ip>:3000/memos-webhook
    ports:
      - "3000:3000"

    # ── Option B: join your existing Memos' Docker network so the two reach each other by
    #    name. Comment out `ports:` above, uncomment below, and set:
    #      memos.baseUrl (config.yaml) = http://memos:5230               (your Memos container name)
    #      webhook URL (in Memos)      = http://memonudge:3000/memos-webhook
    # networks: [memos-net]

volumes:
  memonudge-data:
# Uncomment together with Option B.
# networks:
#   memos-net:
#     external: true
#     name: memos_default
